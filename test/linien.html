<!doctype html>
<meta charset="utf-8">
<title>Prüfstand: Linien</title>
<body style="background:#0B0E13;margin:0">
<script src="../power-flow-card-plus-mobile.js"></script>
<script src="pruef.js"></script>
<script>
// Geometrie der Verbindungen: Länge, Punktraster, Abstände, Anfahrt.

const S = {
  "sensor.q1": zustand("sensor.q1", 3340, "W"),
  "sensor.q2": zustand("sensor.q2", 3230, "W"),
  "sensor.q3": zustand("sensor.q3", 601, "W"),
  "sensor.q4": zustand("sensor.q4", 900, "W"),
  "sensor.q5": zustand("sensor.q5", 1500, "W"),
  "sensor.haus": zustand("sensor.haus", 5170, "W"),
  "sensor.netz": zustand("sensor.netz", -455, "W"),
  "sensor.b1": zustand("sensor.b1", -1320, "W"),
  "sensor.soc1": zustand("sensor.soc1", 34, "%"),
  "sensor.b2": zustand("sensor.b2", 2130, "W"),
  "sensor.soc2": zustand("sensor.soc2", 69, "%"),
  "sensor.wb": zustand("sensor.wb", 3960, "W"),
  "sensor.wb2": zustand("sensor.wb2", 10800, "W"),
  "sensor.car": zustand("sensor.car", 81, "%"),
  "sensor.car2": zustand("sensor.car2", 55, "%"),
};
const LEISTUNG = { "#FFC300": 3340, "#FF5A2D": 3230 };

const bau = (nQ, nB, spalten, w, h) => karte({
  sources: [1, 2, 3, 4, 5].slice(0, nQ).map((i) => ({ power: "sensor.q" + i, name: "Q" + i })),
  house: "sensor.haus", grid: "sensor.netz",
  batteries: [{ power: "sensor.b1", soc: "sensor.soc1" }, { power: "sensor.b2", soc: "sensor.soc2" }].slice(0, nB),
  wallboxes: [
    { power: "sensor.wb", name: "WB1", car: "sensor.car", car_name: "Auto 1" },
    { power: "sensor.wb2", name: "WB2", car: "sensor.car2", car_name: "Auto 2" },
  ].slice(0, spalten),
}, S, w, h);

const linien = (svg) => [...svg.querySelectorAll("path.flow-dash")].map((p) => {
  const da = p.getAttribute("stroke-dasharray").split(" ").map(Number);
  const lw = +p.getAttribute("stroke-width");
  const len = p.getTotalLength();
  const period = da.reduce((a, b) => a + b, 0);
  return { len, lw, period, punkt: da[0], luecke: da[1] - lw, farbe: p.getAttribute("stroke") };
});
const bahnen = (svg) => [...svg.querySelectorAll("path[stroke-opacity]")];

// Kleinster Abstand zwischen zwei verschiedenen Bahnen, ohne die Stellen,
// an denen sie sich absichtlich treffen.
const engsteNaehe = (svg) => {
  const alle = bahnen(svg).map((p) => punkte(p, 60));
  let min = Infinity;
  for (let a = 0; a < alle.length; a++) for (let b = a + 1; b < alle.length; b++) {
    let m = Infinity;
    for (const p of alle[a]) for (const q of alle[b]) m = Math.min(m, Math.hypot(p[0] - q[0], p[1] - q[1]));
    if (m > 1) min = Math.min(min, m);
  }
  return min;
};

(async () => {
  // --- Über alle Formate und Bestückungen ---------------------------------
  let kuerzeste = Infinity, engste = Infinity, wenigste = Infinity, abweichung = 0, umkehr = 0, leer = 0;
  for (const [w, h] of [[1000, 460], [1000, 677], [760, 500], [560, 620], [400, 760], [380, 620], [340, 900]]) {
    for (const nQ of [1, 2, 3, 4, 5]) for (const [nB, sp] of [[0, 0], [1, 1], [2, 2]]) {
      const { svg, box } = bau(nQ, nB, sp, w, h);
      const ls = linien(svg);
      if (!ls.length) leer++;
      for (const l of ls) {
        kuerzeste = Math.min(kuerzeste, l.len);
        engste = Math.min(engste, l.luecke);
        wenigste = Math.min(wenigste, l.len / l.period);
        const n = Math.round(l.len / l.period);
        abweichung = Math.max(abweichung, Math.abs(l.len - n * l.period) / l.len);
      }
      const q = ls.filter((l) => LEISTUNG[l.farbe] != null);
      for (const a of q) for (const b of q) {
        if (LEISTUNG[a.farbe] > LEISTUNG[b.farbe] && a.lw < b.lw - 0.05) umkehr++;
      }
      box.remove();
    }
  }
  ok("jedes Format hat Verbindungen", leer, 0);
  ok("kürzeste Verbindung über 12 px", kuerzeste > 12, true);
  ok("überall sichtbare Lücke zwischen den Punkten", engste > 0.5, true);
  ok("überall mindestens zwei Punkte", wenigste >= 1.99, true);
  ok("das Punktraster passt ganzzahlig auf den Weg", abweichung < 0.01, true);
  ok("Dicke kehrt die Reihenfolge nie um", umkehr, 0);

  // --- Knotenreihen rutschen nur auf breiten Flächen -----------------------
  const knoten = (svg, W, H, y0) => [...new Set([...svg.querySelectorAll("circle")]
    .filter((c) => Math.abs(+c.getAttribute("r") - 0.074 * W) < 0.004 * W)
    .map((c) => Math.round(+c.getAttribute("cy") * 10) / 10))].sort((a, b) => a - b);
  const masse = (svg) => {
    const vb = svg.getAttribute("viewBox").split(" ").map(Number);
    const a = Math.min(0.78, Math.max(0.56, vb[2] / vb[3]));
    let W = vb[2], H = vb[2] / a;
    if (H > vb[3]) { H = vb[3]; W = vb[3] * a; }
    return { W, H, y0: (vb[3] - H) / 2 };
  };
  {
    const { svg, box } = bau(1, 2, 1, 380, 700);
    const { W, H, y0 } = masse(svg);
    const k = knoten(svg, W, H, y0);
    ok("hohe Fläche: Sammelknoten unverändert bei 0,268", Math.abs(k[0] - (y0 + 0.268 * H)) < 0.6, true);
    ok("hohe Fläche: Verteilknoten unverändert bei 0,445", Math.abs(k[1] - (y0 + 0.445 * H)) < 0.6, true);
    box.remove();
  }
  {
    const { svg, box } = bau(1, 2, 1, 1000, 500);
    const { W, H, y0 } = masse(svg);
    const k = knoten(svg, W, H, y0);
    ok("breite Fläche: Sammelknoten rutscht herunter", k[0] > y0 + 0.29 * H, true);
    box.remove();
  }

  // --- Zwei Ladespalten -----------------------------------------------------
  for (const [w, h] of [[400, 760], [1000, 500], [560, 620]]) {
    const { svg, box } = bau(1, 1, 2, w, h);
    ok(`zwei Ladespalten ${w}x${h}: nichts läuft dicht nebenher`, engsteNaehe(svg) > 12, true);
    box.remove();
  }
  {
    const { svg, box } = bau(1, 1, 2, 400, 760);
    const vb = svg.getAttribute("viewBox").split(" ").map(Number);
    const unten = bahnen(svg).map((p) => {
      const pts = punkte(p, 40);
      return { d: p.getAttribute("d"), startX: pts[0][0], endeX: pts[pts.length - 1][0],
        minY: Math.min(...pts.map((q) => q[1])) };
    }).filter((b) => b.minY > 0.5 * vb[3]);
    ok("unten gibt es Bahnen", unten.length > 0, true);
    ok("keine Bahn läuft unten nach links zurück", unten.every((b) => b.endeX >= b.startX - 3), true);
    // Die beiden Äste tragen einen Bogen und laufen nur kurz gemeinsam.
    const aeste = unten.filter((b) => {
      const m = b.d.match(/^M ([\d.]+) ([\d.]+)/);
      return m && +m[2] > 0.5 * vb[3] && +m[2] < 0.75 * vb[3];
    });
    ok("beide Äste starten an derselben Stelle", aeste.length, 2);
    ok("beide Äste haben einen Bogen", aeste.every((b) => b.d.includes("Q")), true);
    box.remove();
  }
  {
    const { svg, box } = bau(1, 1, 1, 400, 760);
    ok("eine Ladespalte kommt ohne Gabel aus", engsteNaehe(svg) > 12, true);
    box.remove();
  }

  // --- Die Weiche -----------------------------------------------------------
  // Größere Bögen, kein gemeinsames Stück der beiden Äste, und am Abzweig
  // kein Fleck aus übereinanderliegenden halbdurchsichtigen Schichten.
  const ohneFluss = (w, h) => karte({ sources: [{ power: "sensor.q1" }], house: "sensor.haus",
    grid: "sensor.netz", animate: false, wallboxes: [
      { power: "sensor.wb", name: "WB1", car: "sensor.car" },
      { power: "sensor.wb2", name: "WB2", car: "sensor.car2" }] }, S, w, h);
  const radien = (d) => [...d.matchAll(/L ([\d.-]+) ([\d.-]+) Q ([\d.-]+) ([\d.-]+) ([\d.-]+) ([\d.-]+)/g)]
    .map((m) => Math.hypot(+m[3] - +m[1], +m[4] - +m[2]));
  const startVon = (p) => { const q = p.getPointAtLength(0); return [q.x, q.y]; };
  const endeVon = (p) => { const q = p.getPointAtLength(p.getTotalLength()); return [q.x, q.y]; };
  // Strang: die Bahn, an deren Ende zwei andere beginnen (die Äste setzen
  // einen Pixel im Strang an).
  const weiche = (svg) => {
    const alle = bahnen(svg);
    const dran = (p, q) => Math.hypot(startVon(q)[0] - endeVon(p)[0], startVon(q)[1] - endeVon(p)[1]) < 2;
    const stamm = alle.find((p) => alle.filter((q) => q !== p && dran(p, q)).length === 2);
    return { stamm, aeste: stamm ? alle.filter((q) => q !== stamm && dran(stamm, q)) : [] };
  };
  // Das Bild rastern, um Helligkeiten zu messen – so, wie es jemand sieht.
  const raster = async (svg) => {
    const vb = svg.getAttribute("viewBox").split(" ").map(Number);
    const bild = await new Promise((fertigBild) => {
      const kopie = svg.cloneNode(true);
      kopie.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      kopie.setAttribute("width", vb[2] * 2);
      kopie.setAttribute("height", vb[3] * 2);
      const img = new Image();
      img.onload = () => fertigBild(img);
      img.onerror = () => fertigBild(null);
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(kopie));
    });
    if (!bild) return null;
    const cv = document.createElement("canvas");
    cv.width = vb[2] * 2; cv.height = vb[3] * 2;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#0B0E13"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(bild, 0, 0);
    return (x, y) => {
      const d = ctx.getImageData(Math.round(x * 2), Math.round(y * 2), 1, 1).data;
      return (d[0] * 299 + d[1] * 587 + d[2] * 114) / 1000;
    };
  };
  {
    const { svg, box } = ohneFluss(390, 700);
    const W = Math.min(390, 700 * 0.78);
    const { stamm, aeste } = weiche(svg);
    ok("Weiche: Strang und zwei Äste gefunden", !!stamm && aeste.length === 2, true);
    if (stamm && aeste.length === 2) {
      const [links, rechts] = aeste.sort((a, b) => endeVon(a)[0] - endeVon(b)[0]);
      const soll = 0.06 * W;
      nah("Weiche: Strang biegt mit dem großen Radius", Math.max(...radien(stamm.getAttribute("d"))), soll, 1);
      nah("Weiche: linker Ast biegt mit dem großen Radius", Math.max(...radien(links.getAttribute("d"))), soll, 1);
      nah("Weiche: rechter Ast biegt mit dem großen Radius", Math.max(...radien(rechts.getAttribute("d"))), soll, 1);
      // Kein gemeinsames Stück: gemessen wird, wie weit die beiden Äste nach
      // dem Abzweig noch aufeinanderliegen (weniger als 0,25 px Abstand).
      // Mit Vorlauf waren das gut 40 px; jetzt nur der eine Pixel Ansatz im
      // Strang und der flache Beginn des Bogens.
      let gemeinsam = 0;
      while (gemeinsam < 60) {
        const a = links.getPointAtLength(gemeinsam), b = rechts.getPointAtLength(gemeinsam);
        if (Math.hypot(a.x - b.x, a.y - b.y) > 0.25) break;
        gemeinsam += 0.5;
      }
      ok("Weiche: der linke Ast biegt sofort ab (gemeinsam unter 10 px)", gemeinsam < 10, true);
      ok("Weiche: der Abzweig liegt einen Radius vor der linken Spalte",
        Math.abs(endeVon(links)[0] - endeVon(stamm)[0] - soll) < 1, true);
      ok("Weiche: alle drei enden stumpf",
        [stamm, links, rechts].every((p) => p.getAttribute("stroke-linecap") === "butt"), true);
      // Stumpf heißt: an den Kugeln ein Stück hinein, damit keine Fuge bleibt.
      const kugeln = [...svg.querySelectorAll("circle")]
        .map((c) => ({ x: +c.getAttribute("cx"), y: +c.getAttribute("cy"), r: +c.getAttribute("r") }))
        .filter((c) => c.r > 5);
      const drin = (pt) => kugeln.some((c) => Math.hypot(pt[0] - c.x, pt[1] - c.y) < c.r - 2);
      ok("Weiche: der Strang beginnt in der Kugel", drin(startVon(stamm)), true);
      ok("Weiche: die Äste enden in ihren Kugeln", drin(endeVon(links)) && drin(endeVon(rechts)), true);
      const g = svg.querySelector("g.weiche");
      ok("Weiche: eine Gruppe, halbdurchsichtig als Ganzes", g && g.getAttribute("opacity"), "0.35");
      ok("Weiche: darin alle drei, jede für sich deckend",
        g ? [...g.querySelectorAll("path")].filter((p) => p.getAttribute("stroke-opacity") === "1").length : 0, 3);
      ok("Weiche: der rechte Ast liegt zuunterst", g && g.firstElementChild === rechts, true);

      // Der Fleck selbst: das Bild rastern und am Abzweig die Helligkeit mit
      // der im Strang kurz davor vergleichen. Drei halbdurchsichtige
      // Schichten übereinander waren dort deutlich heller als eine.
      const hell = await raster(svg);
      ok("Weiche: das Bild lässt sich rastern", !!hell, true);
      if (hell) {
        const L = stamm.getTotalLength();
        const vorher = stamm.getPointAtLength(L - 10);
        const P = endeVon(stamm);
        const grund = hell(vorher.x, vorher.y);
        const proben = [-3, -1.5, -0.5, 0, 0.5, 1.5, 4].map((dx) => hell(P[0] + dx, P[1]));
        ok("Weiche: der Strang ist sichtbar", grund > 30, true);
        ok("Weiche: am Abzweig kein hellerer Fleck", Math.max(...proben) - grund < 8, true);
        ok("Weiche: am Abzweig keine dunklere Fuge", grund - Math.min(...proben) < 8, true);
      }
    }
    box.remove();
  }
  // Meldet ein Zähler am Strang weniger als der stärkere Ast, ist der Strang
  // schmaler. Eine runde Kappe des Asts stand dann als Knubbel über dem
  // Strangende hinaus.
  {
    const s = { ...S, "sensor.kreis": zustand("sensor.kreis", 1500, "W") };
    const { svg, box } = karte({ sources: [{ power: "sensor.q1" }], house: "sensor.haus", grid: "sensor.netz",
      animate: false, wallbox_total: "sensor.kreis", wallboxes: [
        { power: "sensor.wb", car: "sensor.car" }, { power: "sensor.wb2", car: "sensor.car2" }] }, s, 390, 700);
    const { stamm, aeste } = weiche(svg);
    const hell = stamm ? await raster(svg) : null;
    if (stamm && hell) {
      const P = endeVon(stamm);
      const breitester = Math.max(...aeste.map((p) => +p.getAttribute("stroke-width")));
      const schmal = +stamm.getAttribute("stroke-width");
      ok("Zähler kleiner: der Strang ist schmaler als der Ast", schmal < breitester - 1, true);
      // Knapp vor dem Abzweig, außerhalb des Strangs, aber innerhalb der
      // halben Astbreite: dort muss Hintergrund sein.
      const y = P[1] - (schmal / 2 + breitester / 2) / 2;
      ok("Zähler kleiner: kein Knubbel am Abzweig", hell(P[0] - 2.5, y) < 20, true);
    } else {
      ok("Zähler kleiner: Weiche gefunden und gerastert", false, true);
    }
    box.remove();
  }

  // Auf allen Formaten: kein Bogen der Weiche enger als die übrigen Ecken.
  // Vorher kam die Ecke des Strangs auf breiten wie schmalen Flächen nur auf
  // ein Drittel davon, weil sie sich das kurze Stück zum Abzweig teilen musste.
  for (const [w, h] of [[1000, 500], [560, 620], [340, 900]]) {
    const { svg, box } = ohneFluss(w, h);
    const g = svg.querySelector("g.weiche");
    const vb = svg.getAttribute("viewBox").split(" ").map(Number);
    const a = Math.min(0.78, Math.max(0.56, vb[2] / vb[3]));
    const W = Math.min(vb[2], vb[3] * a);
    const kleinster = g ? Math.min(...[...g.querySelectorAll("path")].map((p) => Math.max(...radien(p.getAttribute("d"))))) : 0;
    ok(`Weiche ${w}x${h}: kein Bogen enger als die übrigen Ecken`, kleinster > 0.045 * W - 0.5, true);
    box.remove();
  }

  // --- Radiale Anfahrt ------------------------------------------------------
  // Das letzte Stück jeder Linie zeigt auf die Mitte des Kreises, in den sie
  // läuft. Sonst liegt die runde Kappe quer zum Ring und schmiert darüber.
  {
    const { svg, box } = bau(5, 2, 0, 390, 620);
    const kreise = [...svg.querySelectorAll("circle")]
      .map((c) => ({ x: +c.getAttribute("cx"), y: +c.getAttribute("cy"), r: +c.getAttribute("r") }))
      .filter((c) => c.r > 5);
    const richtungFehler = (p, ziel) => {
      const L = p.getTotalLength();
      const e = p.getPointAtLength(L), d = p.getPointAtLength(Math.max(0, L - 6));
      const rich = Math.atan2(e.y - d.y, e.x - d.x);
      const radial = Math.atan2(ziel.y - e.y, ziel.x - e.x);
      let diff = Math.abs(rich - radial) * 180 / Math.PI;
      while (diff > 180) diff = 360 - diff;
      return diff;
    };
    // Für jede Bahn: der Kreis, an dessen Rand sie endet.
    const fehler = bahnen(svg).map((p) => {
      const L = p.getTotalLength();
      const e = p.getPointAtLength(L);
      const ziel = kreise.find((c) => Math.abs(Math.hypot(e.x - c.x, e.y - c.y) - c.r) < 1.5);
      return ziel ? richtungFehler(p, ziel) : null;
    }).filter((x) => x != null);
    ok("jede Linie endet an einem Kreisrand", fehler.length, bahnen(svg).length);
    ok("alle laufen radial in den Knoten", Math.max(...fehler) < 5, true);
    box.remove();
  }

  fertig();
})();
</script>
